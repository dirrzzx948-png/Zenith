name: Welcome Contributors

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest

    steps:
      - name: Welcome new contributor
        uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

          issue-message: |
            👋 Terima kasih sudah membuka issue di Zenith!

            Kami akan mengeceknya secepatnya.

          pr-message: |
            👋 Terima kasih sudah berkontribusi ke Zenith!

            Pull request kamu sudah diterima dan akan kami review.
